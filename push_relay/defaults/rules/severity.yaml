# Severity per event action: low | normal | high | urgent
#   Bark: passive | active | timeSensitive | critical     ntfy priority: 2 | 3 | 4 | 5
# Lookup order: "<source>.<instance>.<action>", "<source>.<action>", "<action>", then default.
# A level chosen by the sender always wins: ?level= in the URL, or the Apprise URL/tag on /notify.
# Override in /config/rules/severity.yaml with only the keys that change, e.g.:
#   events:
#     radarr.radarr-4k.grab: normal
default: normal

events:
  test: normal

  # *arr media events
  grab: low
  import: normal
  upgrade: normal
  added: low
  deleted: low
  file_deleted: low
  rename: low
  retag: low
  manual_interaction: high
  download_failure: high
  import_failure: high

  # *arr health and updates
  health_warning: high
  health_error: urgent
  health_restored: low
  update: low

  # Seerr
  request_pending: normal
  request_auto_requested: low
  request_approved: low
  request_auto_approved: low
  request_available: normal
  request_declined: normal
  request_failed: high
  issue_created: high
  issue_comment: normal
  issue_resolved: low
  issue_reopened: high

  # Decypharr
  download_complete: low
  download_failed: high
  repair_pending: normal
  repair_complete: normal
  repair_failed: high
  repair_cancelled: low

  # /notify (Apprise type), when the sender gives no level
  info: normal
  success: normal
  warning: high
  failure: high

  # Dispatcharr: playback is passive; errors and security events break through Focus
  dispatcharr.channel_start: low
  dispatcharr.channel_stop: low
  dispatcharr.channel_reconnect: low
  dispatcharr.stream_switch: low
  dispatcharr.channel_failover: normal
  dispatcharr.channel_error: high
  dispatcharr.recording_start: low
  dispatcharr.recording_end: normal
  dispatcharr.recording_interrupted: high
  dispatcharr.epg_refresh: low
  dispatcharr.m3u_refresh: low
  dispatcharr.epg_error: high
  dispatcharr.m3u_error: high
  dispatcharr.client_connect: low
  dispatcharr.client_disconnect: low
  dispatcharr.login_failed: high
  dispatcharr.epg_blocked: high
  dispatcharr.m3u_blocked: high
  dispatcharr.blocked: high
  dispatcharr.vod_start: low
  dispatcharr.vod_stop: low
  dispatcharr.vod: low
