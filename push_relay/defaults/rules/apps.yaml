# Presentation per source, optionally per instance (keyed by the ?instance= value or /notify/<key>).
#   name    display name (default: the instance value)
#   emoji   title prefix when the event has none of its own (health and test events bring theirs)
#   tag     ntfy tag (emoji shortcode)
#   icon    Bark notification icon
#   tap     URL opened on tap when the event has no link of its own (none by default; media events
#           link to TMDB, TVDB, MusicBrainz, StashDB or Seerr, health issues to the *arr wiki)
#   group   Bark group / ntfy topic
#   groups  group per event kind (media | health | generic), wins over group
#
# Entries merge: default <- source <- instance. The request URL wins over all of them:
#   ?name= ?emoji= ?tag= ?icon= ?tap= ?group= ?level=
# Group order: ?group=, group from the Apprise payload/URL (/notify), groups[kind], group.
#
# Override in /config/rules/apps.yaml with only the keys that change, e.g.:
#   radarr:
#     instances:
#       radarr-4k: {group: movies-4k}

default:
  group: system
  groups:
    health: system

decypharr:
  emoji: "📥"
  tag: inbox_tray
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/decypharr.png
  group: downloads

lidarr:
  emoji: "🎵"
  tag: notes
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/lidarr.png
  group: arrs

# Apprise-only apps (/notify/<instance>)
# No emoji or tag by default; set them per instance or with ?emoji= / ?tag=.
notify:
  instances:
    speedtest:
      emoji: "🚀"
      tag: rocket
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/speedtest-tracker.png
      group: network

prowlarr:
  emoji: "🔎"
  tag: mag
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/prowlarr.png
  group: arrs

radarr:
  emoji: "🎬"
  tag: clapper
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/radarr-v1.png  # filled logo; the current one is a bare outline that looks tiny
  group: arrs

seerr:
  emoji: "🍿"
  tag: popcorn
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/seerr.png
  group: requests

sonarr:
  emoji: "📺"
  tag: tv
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/sonarr.png
  group: arrs

whisparr:
  emoji: "🔞"
  tag: underage
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/whisparr.png
  group: arrs
