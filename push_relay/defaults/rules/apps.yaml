# Presentation per source, optionally per instance (keyed by the ?instance= value or /notify/<key>).
#   name    display name (default: the instance value)
#   emoji   title prefix when the event has none of its own (health and test events bring theirs)
#   tag     ntfy tag (emoji shortcode)
#   icon    Bark notification icon
#   tap     URL opened when the notification is tapped
#   group   Bark group / ntfy topic
#   groups  group per event kind (media | health | generic), wins over group
# Group order: ?group= in the URL, then groups[kind], then group, then the instance name.
# Entries merge: default <- source <- instance. Override in /config/rules/apps.yaml with only the
# keys that change, e.g.:
#   radarr:
#     instances:
#       rdrr-4k: {group: movies-4k}
default:
  groups:
    health: health

radarr:
  emoji: "🎬"
  tag: clapper
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/radarr.png
  tap: dashboarr://movies
  group: arrs

sonarr:
  emoji: "📺"
  tag: tv
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/sonarr.png
  tap: dashboarr://tv
  group: arrs

lidarr:
  emoji: "🎵"
  tag: notes
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/lidarr.png
  tap: dashboarr://music
  group: arrs

whisparr:
  emoji: "🔞"
  tag: underage
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/whisparr.png
  group: arrs

prowlarr:
  emoji: "🔎"
  tag: mag
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/prowlarr.png
  group: arrs

seerr:
  emoji: "🍿"
  tag: popcorn
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png
  tap: dashboarr://requests
  group: requests

decypharr:
  emoji: "📥"
  tag: inbox_tray
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/decypharr.png
  tap: dashboarr://downloads
  group: downloads

# Apprise-only apps (/notify): no group, so each lands in a group named after its instance
notify:
  emoji: "🔔"
  tag: bell
  instances:
    speedtest:
      emoji: "🚀"
      tag: rocket
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/speedtest-tracker.png
    bazarr:
      emoji: "💬"
      tag: speech_balloon
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/bazarr.png
